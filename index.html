<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SQY — PC Hiring Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#f0ede8;--border:#e2ddd8;--border2:#ccc8c2;--text:#1a1816;--text2:#6b6760;--text3:#9e9a94;--green-bg:#e8f5e0;--green:#2d6a1f;--red-bg:#fceaea;--red:#992222;--amber-bg:#fef3db;--amber:#7a4d10;--purple-bg:#eeedfd;--purple:#4a3db0;--teal-bg:#e0f5ee;--teal:#0e6b50;--gray-bg:#eeece8;--gray:#555350;--radius:10px;--radius-lg:14px;--font:'DM Sans',sans-serif;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#111110;--surface:#1c1b19;--surface2:#252421;--border:#2e2c29;--border2:#3d3b37;--text:#f0ede8;--text2:#9e9a94;--text3:#6b6760;--green-bg:#1a2e15;--green:#7ecb6a;--red-bg:#2e1515;--red:#f08080;--amber-bg:#2a1e09;--amber:#f0b860;--purple-bg:#1a1640;--purple:#a89ef5;--teal-bg:#0a2119;--teal:#5fd4a8;--gray-bg:#1e1d1b;--gray:#b0aba4}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;transition:background .2s,color .2s}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;gap:12px;flex-wrap:wrap}
.header-left h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.header-left p{font-size:12px;color:var(--text2);margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-right:4px;transition:background .3s}
.sync-dot.live{background:#2d6a1f}
.sync-dot.error{background:#992222}
.sync-status{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
.btn{padding:8px 16px;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--font)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.85}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem}
.metric-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.metric-value{font-size:24px;font-weight:600;line-height:1}
.metric-sub{font-size:11px;color:var(--text3);margin-top:4px}
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:3px;margin-bottom:1.25rem;width:fit-content}
.tab{padding:6px 14px;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:none;font-family:var(--font)}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-select{padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:var(--font)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2);cursor:pointer}
.name-cell{font-weight:500;font-size:13px}
.sub-text{font-size:11px;color:var(--text2);margin-top:2px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-selected{background:var(--green-bg);color:var(--green)}
.badge-joined{background:var(--teal-bg);color:var(--teal)}
.badge-offered{background:var(--amber-bg);color:var(--amber)}
.badge-pending{background:var(--gray-bg);color:var(--gray)}
.badge-dropped{background:var(--red-bg);color:var(--red)}
.badge-pipeline{background:var(--purple-bg);color:var(--purple)}
.badge-rejected{background:var(--red-bg);color:var(--red)}
.stars{display:inline-flex;gap:3px;align-items:center}
.star{width:9px;height:9px;border-radius:2px}
.leader-grid{display:flex;flex-direction:column;gap:10px}
.leader-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem}
.leader-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.leader-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.leader-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lstat{text-align:center}
.lstat-num{font-size:18px;font-weight:600}
.lstat-lbl{font-size:10px;color:var(--text2);margin-top:2px}
.lstat-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.lstat-fill{height:100%;border-radius:2px}
.target-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin-bottom:10px}
.target-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mini-metric{background:var(--surface2);border-radius:var(--radius);padding:.7rem .85rem}
.mini-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mini-val{font-size:17px;font-weight:600}
.progress-wrap{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.progress-text{font-size:11px;color:var(--text2);white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;max-width:520px;width:100%;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.modal-title{font-size:15px;font-weight:600}
.detail-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-of-type{border-bottom:none}
.detail-label{color:var(--text2);min-width:110px;flex-shrink:0;font-size:12px;padding-top:1px}
.detail-val{color:var(--text);flex:1}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:var(--surface2);color:var(--text2);margin:2px 2px 0 0;border:1px solid var(--border)}
.status-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
textarea{width:100%;min-height:110px;padding:12px;font-size:13px;font-family:var(--font);border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);resize:vertical;line-height:1.6}
textarea:focus{outline:none;border-color:var(--text)}
.feedback{padding:10px 12px;border-radius:var(--radius);font-size:12px;margin-top:10px;display:none}
.fb-success{background:var(--green-bg);color:var(--green)}
.fb-error{background:var(--red-bg);color:var(--red)}
.fb-loading{background:var(--purple-bg);color:var(--purple)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty i{font-size:36px;opacity:.3;display:block;margin-bottom:10px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;flex-wrap:wrap}
.loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.dash-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border)}
.dash-table th{padding:9px 12px;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;text-align:center}
.dash-table th:first-child{text-align:left}
.dash-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);text-align:center;vertical-align:middle}
.dash-table td:first-child{text-align:left;font-weight:500}
.dash-table tr:last-child td{border-bottom:none;font-weight:600;background:var(--surface2)}
.dash-table tr:hover td{background:var(--surface2)}
.dash-num{font-size:15px;font-weight:600}
.edit-target-btn{padding:3px 8px;font-size:11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text2);cursor:pointer;font-family:var(--font)}
.edit-target-btn:hover{background:var(--surface2);color:var(--text)}
.date-filter-wrap{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.date-input{padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font)}
.dash-section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:1.25rem 0 8px}
.target-edit-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:10px}
.input-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:11px;color:var(--text2)}
.input-group input{padding:6px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font)}
.input-group input:focus{outline:none;border-color:var(--text)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.metrics{grid-template-columns:repeat(3,1fr)}.leader-stats{grid-template-columns:repeat(3,1fr)}.target-mini-grid{grid-template-columns:repeat(2,1fr)}th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}
</style>
</head>
<body>
<div id="loading-screen" class="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text2)">Loading candidates...</div>
</div>
<div class="app" style="display:none" id="main-app">
  <div class="header">
    <div class="header-left">
      <h1>SQY — PC Hiring Tracker</h1>
      <p>KAM Pipeline · FY 2025–26</p>
    </div>
    <div class="header-right">
      <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Connecting...</span></div>
      <button class="btn" onclick="toggleTheme()"><i class="ti ti-moon-stars"></i></button>
      <button class="btn primary" onclick="openAddModal()"><i class="ti ti-clipboard-text"></i> Paste WA Feedback</button>
    </div>
  </div>
  <div class="metrics" id="metrics"></div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('pipeline',this)">All Candidates</button>
      <button class="tab" onclick="switchTab('leaders',this)">Leader View</button>
      <button class="tab" onclick="switchTab('dashboard',this)">Dashboard</button>
      <button class="tab" onclick="switchTab('targets',this)">Targets</button>
    </div>
    <button class="btn sm" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
  </div>
  <div id="tab-pipeline">
    <div class="filters">
      <select class="filter-select" id="f-leader" onchange="renderTable()"><option value="">All Leaders</option></select>
      <select class="filter-select" id="f-status" onchange="renderTable()">
        <option value="">All Status</option>
        <option>Selected</option><option>Joined</option><option>Offer Sent</option>
        <option>Offer Not Sent</option><option>Dropped</option><option>Rejected</option><option>Pipeline</option>
      </select>
      <select class="filter-select" id="f-city" onchange="renderTable()"><option value="">All Cities</option></select>
      <select class="filter-select" id="f-source" onchange="renderTable()">
        <option value="">All Sources</option><option>Referral</option><option>Recruiter</option>
      </select>
    </div>
    <div class="table-wrap" id="table-container"></div>
  </div>
  <div id="tab-leaders" style="display:none"><div class="leader-grid" id="leaders-container"></div></div>
  <div id="tab-dashboard" style="display:none">
    <div id="dashboard-container"></div>
  </div>
  <div id="tab-targets" style="display:none"><div id="targets-container"></div></div>
</div>

<div class="overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Paste WhatsApp Feedback</div>
      <button class="btn sm" onclick="closeAddModal()"><i class="ti ti-x"></i></button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">CBO group ka message paste karo — Claude auto-extract karke database mein save karega.</p>
    <textarea id="wa-input" placeholder="Example:&#10;Rahul Sharma - KAM Mumbai (Majid) - Selected&#10;- very good communication&#10;- 3 years in Indiamart&#10;- hunger for growth&#10;- CTC - 10% hike"></textarea>
    <div id="add-feedback" class="feedback"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn primary" id="parse-btn" onclick="parseAndAdd()"><i class="ti ti-sparkles"></i> Parse & Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="d-name">Candidate Details</div>
      <button class="btn sm" onclick="closeDetailModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="d-body"></div>
    <div class="modal-footer">
      <button class="btn danger" onclick="deleteCandidate()"><i class="ti ti-trash"></i> Remove</button>
      <button class="btn" onclick="closeDetailModal()">Close</button>
    </div>
  </div>
</div>

let candidates=[];
let activeId=null;

async function dbFetch(path,opts={}){
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,{
    ...opts,
    headers:{
      'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      ...(opts.headers||{})
    }
  });
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const t=await res.text();
  return t?JSON.parse(t):null;
}

async function loadFromDB(){
  const rows=await dbFetch('candidates?order=added_on.desc&limit=500');
  return rows||[];
}

async function saveCandidate(c){
  const row={
    id:c.id,name:c.name,role:c.role,city:c.city,leader:c.leader,
    status:c.status,rating:c.rating,communication:c.communication,
    hunger:c.hunger,background:c.background,market:c.market||'',
    source:c.source,ctc:c.ctc,tags:c.tags||[],notes:c.notes||'',
    remarks:c.remarks||'',added_on:c.addedOn,updated_at:new Date().toISOString()
  };
  await dbFetch('candidates',{
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)
  });
}

async function updateCandidateStatus(id,status){
  await dbFetch('candidates?id=eq.'+id,{
    method:'PATCH',
    body:JSON.stringify({status,updated_at:new Date().toISOString()})
  });
}

async function deleteCandidateDB(id){
  await dbFetch('candidates?id=eq.'+id,{method:'DELETE'});
}

async function seedDB(){
  setSyncStatus('seeding');
  const dbRows=SEED_DATA.map(c=>({
    id:c.id,name:c.name,role:c.role||'KAM',city:c.city||'',leader:c.leader||'',
    status:c.status||'Pipeline',rating:c.rating||3,communication:c.communication||'',
    hunger:c.hunger||'',background:c.background||'',market:c.market||'',
    source:c.source||'',ctc:c.ctc||'',tags:c.tags||[],notes:c.notes||'',
    remarks:c.remarks||'',added_on:c.addedOn||new Date().toISOString(),
    updated_at:new Date().toISOString()
  }));
  await dbFetch('candidates',{
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(dbRows)
  });
}

function dbRowToCandidate(r){
  return {
    id:r.id,name:r.name,role:r.role||'KAM',city:r.city||'',
    leader:r.leader||'',status:r.status||'Pipeline',rating:r.rating||3,
    communication:r.communication||'',hunger:r.hunger||'',
    background:r.background||'',market:r.market||'',source:r.source||'',
    ctc:r.ctc||'',tags:r.tags||[],notes:r.notes||'',remarks:r.remarks||'',
    addedOn:r.added_on||new Date().toISOString()
  };
}

function setSyncStatus(s){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  if(!dot)return;
  dot.className='sync-dot';
  if(s==='live'){dot.classList.add('live');txt.textContent='Live';}
  else if(s==='error'){dot.classList.add('error');txt.textContent='Offline';}
  else if(s==='seeding'){txt.textContent='Setting up DB...';}
  else{txt.textContent='Syncing...';}
}

async function init(){
  if(localStorage.getItem('sq_theme')==='dark')document.body.setAttribute('data-theme','dark');
  try{
    let rows=await loadFromDB();
    if(rows.length===0){
      await seedDB();
      rows=await loadFromDB();
    }
    candidates=rows.map(dbRowToCandidate);
    setSyncStatus('live');
  }catch(e){
    console.error('DB error:',e);
    setSyncStatus('error');
    candidates=SEED_DATA.map(c=>({...c}));
  }
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('main-app').style.display='block';
  render();
}

function uid(){return Math.random().toString(36).slice(2,8);}

function badgeHtml(s){
  const m={Selected:'selected',Joined:'joined','Offer Sent':'offered','Offer Not Sent':'pending',Dropped:'dropped',Pipeline:'pipeline',Rejected:'rejected'};
  return `<span class="badge badge-${m[s]||'pending'}">${s}</span>`;
}

function starsHtml(r){
  if(!r)return '<span style="color:var(--text3);font-size:11px">—</span>';
  const colors={5:'#2d6a1f',4:'#63991a',3:'#9a7200',2:'#c0512a',1:'#992222'};
  let h='<span class="stars">';
  for(let i=1;i<=5;i++)h+=`<span class="star" style="background:${i<=r?colors[r]:'var(--border)'}"></span>`;
  return h+'</span>';
}

function render(){renderMetrics();renderTable();renderLeaders();renderTargets();populateFilters();}

function renderMetrics(){
  const t=candidates.length;
  const j=candidates.filter(c=>c.status==='Joined').length;
  const s=candidates.filter(c=>c.status==='Selected').length;
  const d=candidates.filter(c=>c.status==='Dropped'||c.status==='Rejected').length;
  const o=candidates.filter(c=>c.status==='Offer Sent'||c.status==='Offer Not Sent').length;
  const cr=t>0?Math.round(j/t*100):0;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total Pipeline</div><div class="metric-value">${t}</div><div class="metric-sub">candidates tracked</div></div>
    <div class="metric"><div class="metric-label">Selected</div><div class="metric-value">${s}</div><div class="metric-sub">awaiting offer</div></div>
    <div class="metric"><div class="metric-label">Offers Out</div><div class="metric-value">${o}</div><div class="metric-sub">pending joining</div></div>
    <div class="metric"><div class="metric-label">Joined</div><div class="metric-value">${j}</div><div class="metric-sub">active KAMs</div></div>
    <div class="metric"><div class="metric-label">Dropped/Rej</div><div class="metric-value">${d}</div><div class="metric-sub">lost in process</div></div>
    <div class="metric"><div class="metric-label">Conv. Rate</div><div class="metric-value">${cr}%</div><div class="metric-sub">pipeline → joined</div></div>`;
}

function populateFilters(){
  const leaders=[...new Set(candidates.map(c=>c.leader).filter(Boolean))].sort();
  const cities=[...new Set(candidates.map(c=>c.city).filter(Boolean))].sort();
  const fl=document.getElementById('f-leader'),fc=document.getElementById('f-city');
  const cL=fl.value,cC=fc.value;
  fl.innerHTML='<option value="">All Leaders</option>'+leaders.map(l=>`<option ${l===cL?'selected':''}>${l}</option>`).join('');
  fc.innerHTML='<option value="">All Cities</option>'+cities.map(c=>`<option ${c===cC?'selected':''}>${c}</option>`).join('');
}

function getFiltered(){
  const l=document.getElementById('f-leader').value;
  const s=document.getElementById('f-status').value;
  const c=document.getElementById('f-city').value;
  const src=document.getElementById('f-source').value;
  return candidates.filter(x=>(!l||x.leader===l)&&(!s||x.status===s)&&(!c||x.city===c)&&(!src||x.source===src))
    .sort((a,b)=>STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status));
}

function renderTable(){
  const f=getFiltered();
  const cont=document.getElementById('table-container');
  if(!f.length){cont.innerHTML=`<div class="empty"><i class="ti ti-users"></i>No candidates found.</div>`;return;}
  cont.innerHTML=`<table>
    <thead><tr><th>Candidate</th><th>City / Leader</th><th>Status</th><th>Rating</th><th>Source</th><th>Added</th></tr></thead>
    <tbody>${f.map(c=>`<tr onclick="openDetail('${c.id}')">

      <td><div>${c.city||'—'}</div><div class="sub-text">${c.leader||''}</div></td>
      <td>${badgeHtml(c.status)}</td>
      <td>${starsHtml(c.rating)}</td>

      <td style="font-size:11px;color:var(--text3)">${new Date(c.addedOn).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</td>

async function parseAndAdd(){
  const text=document.getElementById('wa-input').value.trim();
  if(!text){showFb('Paste a message first.','error');return;}
  const btn=document.getElementById('parse-btn');
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Parsing...';
  showFb('AI message padh raha hai...','loading');
  try{
    const prompt=`You are a hiring data parser for a real estate company in India. Parse this WhatsApp message and return ONLY valid JSON — no markdown, no backticks, no explanation.

Even if the message has spelling mistakes, short forms, or Hinglish — understand the intent and extract correctly.

Return this exact JSON structure:
{"name":"full candidate name","role":"KAM or DCM or AM","city":"one of: Mumbai/Pune/Bangalore/NCR/Navi Mumbai/KDMC","leader":"reporting manager name (usually in brackets)","status":"one of: Selected/Dropped/Joined/Offer Sent/Offer Not Sent/Pipeline/Rejected","communication":"one of: Excellent/Very Good/Good/Decent/Average/Below Average/Poor","hunger":"one of: Very High/High/Medium/Low","background":"previous company or domain","market":"market area they will cover","source":"Referral or Recruiter","ctc":"CTC terms as mentioned","rating":4,"tags":["2-4 short highlights"],"notes":"any other important info","remarks":"1-2 line summary of overall feedback"}

Rules:
- rating is 1-5: 5=excellent overall, 4=good, 3=average, 2=weak, 1=poor
- If status says "selected" assume Selected, "joined" assume Joined, "drop" or "dropped" assume Dropped
- Fix spelling mistakes intelligently
- Use null for genuinely missing fields
- leader name is usually in brackets like (Shashank) or (Majid)

Message to parse:
${text}`;

    const res=await fetch('/.netlify/functions/parse',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    if(!res.ok) throw new Error('Function error: '+res.status);
    const p=await res.json();
    if(p.error) throw new Error(p.error);
    const candidate={
      id:uid(),name:p.name||'Unknown',role:p.role||'KAM',city:p.city||'',
      leader:p.leader||'',status:p.status||'Pipeline',communication:p.communication||'',
      hunger:p.hunger||'',background:p.background||'',market:p.market||'',
      source:p.source||'',ctc:p.ctc||'',rating:p.rating||3,
      tags:p.tags||[],notes:p.notes||'',remarks:p.remarks||'',
      addedOn:new Date().toISOString()
    };
    await saveCandidate(candidate);
    candidates.unshift(candidate);
    render();
    showFb(`✓ Saved: ${candidate.name} — ${candidate.status} — ${candidate.city}`,'success');
    setTimeout(closeAddModal,1500);
  }catch(e){
    console.error(e);
    showFb('Parse/save failed. Check connection.','error');
  }finally{
    btn.disabled=false;btn.innerHTML='<i class="ti ti-sparkles"></i> Parse & Save';
  }
}

function exportDashCSV() {
  const targets = getTargets();
  const leaders = [...new Set(candidates.map(c => c.leader).filter(Boolean))].sort();
  const headers = ['Leader','Selected','Dropped Pre-Offer','Offer Pending','In Prospect','LTD Offers','Joined','Not Joined','Current KAMs','+May','+June','Total June End','Team Target','Hire Target','Gap','Tent May','Tent June','Remarks'];
  const rows = leaders.map(l => {
    const lc = candidates.filter(c => c.leader === l);
    const t = targets[l]||{};
    const joined = lc.filter(c=>c.status==='Joined').length;
    const gap = (t.teamTarget||0)-(t.currentKAMs||0)-joined;
    return [
      l,
      lc.filter(c=>!['Dropped','Rejected'].includes(c.status)).length,
      lc.filter(c=>c.status==='Dropped'||c.status==='Rejected').length,
      lc.filter(c=>c.status==='Offer Not Sent').length,
      lc.filter(c=>c.status==='Selected').length,
      lc.filter(c=>c.status==='Offer Sent').length,
      joined,
      lc.filter(c=>c.status==='Dropped').length,
      t.currentKAMs||0, t.newKAMsMay||0, t.newKAMsJune||0,
      t.totalJuneEnd||0, t.teamTarget||0, t.hireTarget||0, gap,
      t.tentMay||0, t.tentJune||0,
      `"${(t.remarks||'').replace(/"/g,"'")}"`
    ].join(',');
  });
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'hiring-dashboard-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function clearDashDate() {
  const f=document.getElementById('dash-from');
  const t=document.getElementById('dash-to');
  if(f) f.value='';
  if(t) t.value='';
  renderDashboard();
}

function openTargetEditor() {
  const targets = getTargets();
  const leaders = [...new Set(candidates.map(c => c.leader).filter(Boolean))].sort();
  const body = leaders.map(l => {
    const t = targets[l]||{};
    return `<div style="background:var(--surface2);border-radius:var(--radius);padding:1rem;margin-bottom:10px">
      <div style="font-weight:600;font-size:13px;margin-bottom:10px;color:var(--text)">${l}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Current KAMs</label><input type="number" id="te_${l}_cur" value="${t.currentKAMs||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">+May KAMs</label><input type="number" id="te_${l}_may" value="${t.newKAMsMay||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">+June KAMs</label><input type="number" id="te_${l}_jun" value="${t.newKAMsJune||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Total June End</label><input type="number" id="te_${l}_jt" value="${t.totalJuneEnd||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Team Target</label><input type="number" id="te_${l}_tt" value="${t.teamTarget||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Hire Target</label><input type="number" id="te_${l}_ht" value="${t.hireTarget||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Tent. May</label><input type="number" id="te_${l}_tmay" value="${t.tentMay||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Tent. June</label><input type="number" id="te_${l}_tjun" value="${t.tentJune||0}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
      </div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:3px"><label style="font-size:10px;color:var(--text2);text-transform:uppercase">Remarks</label><input type="text" id="te_${l}_rem" value="${t.remarks||''}" style="padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;width:100%"></div>
    </div>`;
  }).join('');

  document.getElementById('d-name').textContent = 'Edit Leader Targets';
  document.getElementById('d-body').innerHTML = `<div style="max-height:65vh;overflow-y:auto;padding-right:4px">${body}</div>`;
  document.querySelector('#detail-modal .modal-footer').innerHTML = `
    <button class="btn" onclick="cancelTargetEdit()">Cancel</button>
    <button class="btn primary" onclick="saveTargetEdits()"><i class="ti ti-device-floppy"></i> Save All Targets</button>
  `;
  document.getElementById('detail-modal').classList.add('open');
}

function cancelTargetEdit() {
  closeDetailModal();
  resetDetailFooter();
}

function saveTargetEdits() {
  const targets = getTargets();
  const leaders = [...new Set(candidates.map(c => c.leader).filter(Boolean))].sort();
  leaders.forEach(l => {
    targets[l] = {
      currentKAMs:  parseInt(document.getElementById('te_'+l+'_cur')?.value)||0,
      newKAMsMay:   parseInt(document.getElementById('te_'+l+'_may')?.value)||0,
      newKAMsJune:  parseInt(document.getElementById('te_'+l+'_jun')?.value)||0,
      totalJuneEnd: parseInt(document.getElementById('te_'+l+'_jt')?.value)||0,
      teamTarget:   parseInt(document.getElementById('te_'+l+'_tt')?.value)||0,
      hireTarget:   parseInt(document.getElementById('te_'+l+'_ht')?.value)||0,
      tentMay:      parseInt(document.getElementById('te_'+l+'_tmay')?.value)||0,
      tentJune:     parseInt(document.getElementById('te_'+l+'_tjun')?.value)||0,
      remarks:      document.getElementById('te_'+l+'_rem')?.value||'',
    };
  });
  saveTargets(targets);
  closeDetailModal();
  resetDetailFooter();
  renderDashboard();
}

function resetDetailFooter() {
  document.querySelector('#detail-modal .modal-footer').innerHTML = `
    <button class="btn danger" onclick="deleteCandidate()"><i class="ti ti-trash"></i> Remove</button>
    <button class="btn" onclick="closeDetailModal()">Close</button>
  `;
}

// ==================== END DASHBOARD ====================

init();
</script>
</body>
</html>
